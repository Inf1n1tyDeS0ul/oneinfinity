# docker-compose.db.yml — OneInfinity databases (standalone subset)
# Generated by install.sh — edit to override defaults.
version: "3.9"

services:

  postgres:
    image: postgres:16
    container_name: oneinfinity-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: "oneinfinity"
      POSTGRES_PASSWORD: "oneinfinity123"
      POSTGRES_DB: "oneinfinity"
    ports:
      - "${PG_PORT:-47293}:5432"
    volumes:
      - oneinfinity-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oneinfinity -d oneinfinity"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: oneinfinity-redis
    restart: unless-stopped
    command: redis-server --requirepass "oneinfinity_redis"
    ports:
      - "${REDIS_PORT:-47294}:6379"
    volumes:
      - oneinfinity-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "oneinfinity_redis", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  neo4j:
    image: neo4j:5
    container_name: oneinfinity-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: "neo4j/neo4j123"
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_apoc_import_file_enabled: "true"
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
    ports:
      - "${NEO4J_HTTP_PORT:-47295}:7474"
      - "${NEO4J_BOLT_PORT:-47296}:7687"
    volumes:
      - oneinfinity-neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s

volumes:
  oneinfinity-pg-data:
  oneinfinity-redis-data:
  oneinfinity-neo4j-data:

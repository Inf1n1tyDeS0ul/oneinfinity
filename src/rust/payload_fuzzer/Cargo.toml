[package]
name = "payload-fuzzer"
version = "0.1.0"
edition = "2021"
description = "Fast async payload fuzzer for OneInfinity active testing"
default-run = "payload-fuzzer"

[[bin]]
name = "payload-fuzzer"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls", "json", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
tokio-stream = "0.1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
tokio-util = { version = "0.7", features = ["io"] }
bytes = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[package]
name = "oneinfinity_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "oneinfinity_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
md-5 = "0.10"
sha2 = "0.10"
digest = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
ipnet = "2"
url = "2"
petgraph = "0.6"
tokio = { version = "1", features = ["full"] }

[profile.release]
panic = "unwind"  # required for catch_unwind to work across PyO3 boundary
opt-level = 3

[workspace]

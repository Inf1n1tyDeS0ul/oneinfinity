[package]
name = "oi-jwt-crack"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "oi-jwt-crack"
path = "src/main.rs"

[dependencies]
clap     = { version = "4", features = ["derive"] }
hmac     = "0.12"
sha2     = "0.10"
base64   = "0.22"
serde    = { version = "1", features = ["derive"] }
serde_json = "1"
rayon    = "1"


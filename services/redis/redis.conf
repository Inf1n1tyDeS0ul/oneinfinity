# ==============================================================
# OneInfinity — Redis Configuration
# Tuned for distributed scan task queuing.
# ==============================================================

# ── Network ───────────────────────────────────────────────────
bind 0.0.0.0
port 6379
protected-mode no
tcp-backlog 511
timeout 300
tcp-keepalive 60

# ── Memory ────────────────────────────────────────────────────
# Cap at 512 MB — task payloads are small JSON blobs.
# Evict oldest keys when full (scan results are ephemeral).
maxmemory 512mb
maxmemory-policy allkeys-lru

# ── Persistence ───────────────────────────────────────────────
# RDB snapshot: save if ≥1 change in 900s, ≥10 in 300s, ≥10000 in 60s
save 900 1
save 300 10
save 60 10000

# AOF off — task queues are ephemeral; losing in-flight tasks on
# restart is acceptable (they will time out on the master and requeue).
appendonly no

# ── Pub/Sub ───────────────────────────────────────────────────
# Workers use PUBLISH/SUBSCRIBE for result broadcasting.
# No limits needed here.

# ── Security ──────────────────────────────────────────────────
# Uncomment and set REDIS_PASSWORD env var + requirepass for production:
# requirepass ${REDIS_PASSWORD}

# Disable dangerous commands
rename-command FLUSHALL ""
rename-command FLUSHDB  ""
rename-command DEBUG    ""
rename-command CONFIG   "REDIS_CONFIG_INTERNAL"

# ── Logging ───────────────────────────────────────────────────
loglevel notice
logfile ""

# ── Performance ───────────────────────────────────────────────
hz 20
activerehashing yes
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes

# ── List settings ─────────────────────────────────────────────
# Task queues are Redis lists. Optimise list compression.
list-max-ziplist-size -2
list-compress-depth 1

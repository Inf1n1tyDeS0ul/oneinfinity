# ==============================================================
# OneInfinity — Nginx Reverse Proxy
# Routes: /api/* → orchestrator:8000
#         /ws/*  → orchestrator:8000 (WebSocket upgrade)
#         /*     → frontend:3000
# ==============================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
    use epoll;
}

http {
    # Use Docker DNS so optional upstreams can resolve at request time
    resolver 127.0.0.11 ipv6=off valid=30s;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;

    # ── Rate limiting ────────────────────────────────────────
    # Protects the API from runaway clients
    limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;

    # ── Upstream: API backend ─────────────────────────────────
    upstream orchestrator {
        server orchestrator:8000;
        keepalive 32;
    }

    # ── Upstream: React frontend ──────────────────────────────
    upstream frontend {
        server frontend:3000;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;

        # ── Health check endpoint (for Docker healthcheck) ───
        location /health {
            access_log off;
            return 200 '{"status":"ok"}';
            add_header Content-Type application/json;
        }

        # ── API routes → orchestrator ─────────────────────────
        location /api/ {
            limit_req zone=api burst=20 nodelay;

            proxy_pass         http://orchestrator;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            client_max_body_size 100m;
        }

        # ── WebSocket route (live log streaming) ─────────────
        location /ws {
            proxy_pass          http://orchestrator;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade    $http_upgrade;
            proxy_set_header    Connection "upgrade";
            proxy_set_header    Host       $host;
            proxy_read_timeout  86400s;
            proxy_send_timeout  86400s;
        }

        # ── Prometheus metrics endpoint ───────────────────────
        location /metrics {
            proxy_pass         http://orchestrator;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            access_log off;
        }

        # ── Swagger / OpenAPI docs ────────────────────────────
        location /docs {
            proxy_pass http://orchestrator;
            proxy_set_header Host $host;
        }

        location /openapi.json {
            proxy_pass http://orchestrator;
        }

        # ── Redis Commander (if enabled) ──────────────────────
        # Use variable-based proxy_pass so nginx can start even if the
        # redis-commander service is not running.
        location /redis/ {
            set $redis_commander_host redis-commander:8081;
            proxy_pass http://$redis_commander_host/;
            proxy_set_header Host $host;
            auth_basic "Redis Commander";
            auth_basic_user_file /etc/nginx/.htpasswd;
        }

        # ── Frontend (catch-all) ──────────────────────────────
        location / {
            proxy_pass         http://frontend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
            proxy_read_timeout 60s;
        }

        # ── Security headers ──────────────────────────────────
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}

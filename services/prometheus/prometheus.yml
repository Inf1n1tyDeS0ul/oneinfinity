# ==============================================================
# OneInfinity — Prometheus Scrape Configuration
# Collects metrics from: orchestrator API, workers, Redis,
# Nginx, and the host node.
# ==============================================================

global:
  scrape_interval:     15s
  evaluation_interval: 15s
  scrape_timeout:      10s

  external_labels:
    monitor: 'oneinfinity'
    environment: 'docker'

# ── Alert rules (optional) ────────────────────────────────────
# rule_files:
#   - /etc/prometheus/alerts/*.yml

# ── Scrape configs ────────────────────────────────────────────
scrape_configs:

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # OneInfinity orchestrator — exposes /metrics (custom endpoint in web/backend/main.py)
  - job_name: 'orchestrator'
    metrics_path: /metrics
    static_configs:
      - targets: ['orchestrator:8000']
    scrape_interval: 10s

  # Redis exporter (deployed via docker-compose.distributed.yml --profile monitoring)
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']

  # ── Optional targets (uncomment when deploying these exporters) ──────────────
  # Worker node exporters (requires prom/node-exporter sidecar per worker)
  # - job_name: 'workers'
  #   static_configs:
  #     - targets: ['worker-recon:9100', 'worker-vuln:9100']
  #       labels:
  #         group: 'scan-workers'

  # Nginx prometheus exporter (requires nginx-prometheus-exporter container)
  # - job_name: 'nginx'
  #   static_configs:
  #     - targets: ['nginx-exporter:9113']

  # Node exporter — host-level metrics (requires prom/node-exporter)
  # - job_name: 'node'
  #   static_configs:
  #     - targets: ['node-exporter:9100']

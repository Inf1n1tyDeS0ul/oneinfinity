# ==============================================================
# OneInfinity — GitHub Actions: Build & Publish Docker Images
#
# Triggers:
#   • Push to main → builds :latest + :sha-XXXXXXX
#   • Version tag  → builds :1.2.3  + :latest
#   • Pull request → build only (no push), used for validation
#
# Images published to GitHub Container Registry (ghcr.io):
#   ghcr.io/inf1n1tydes0ul/oneinfinity:latest          (core)
#   ghcr.io/inf1n1tydes0ul/oneinfinity:latest-ai       (with AI deps)
#
# Required secrets (set in repo Settings → Secrets):
#   GHCR_PAT — Personal Access Token with write:packages scope
#               (GITHUB_TOKEN works for public repos automatically)
# ==============================================================

name: Build & Publish Docker Image

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main
  # Allow manual trigger from Actions tab
  workflow_dispatch:
    inputs:
      build_ai:
        description: "Build the AI variant image?"
        required: false
        default: "false"
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/oneinfinity

jobs:
  # ── Job 1: Build & push core image ───────────────────────────
  build-core:
    name: Build core image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Needed for SBOM attestation (optional but recommended)
      id-token: write

    outputs:
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Set up QEMU for multi-arch builds ──────────────────
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # ── Set up Docker Buildx ───────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # GitHub-hosted runners support layer caching via Actions cache
          driver-opts: |
            image=moby/buildkit:buildx-stable-1

      # ── Log in to GHCR ─────────────────────────────────────
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # GITHUB_TOKEN has write:packages on public repos automatically.
          # For private repos, create a PAT and store as GHCR_PAT secret.
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Generate image tags & labels ─────────────────────
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Tag with semver on version tags (v1.2.3 → 1.2.3, 1.2, 1)
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # Tag latest on main branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            # Short SHA tag for traceability
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=OneInfinity
            org.opencontainers.image.description=AI-Powered Offensive Security Research Framework
            org.opencontainers.image.vendor=OneInfinity

      # ── Build & push ──────────────────────────────────────
      - name: Build and push core image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # Build both AMD64 and ARM64 for Apple Silicon / cloud ARM
          platforms: linux/amd64,linux/arm64
          # Only push on non-PR events
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            INSTALL_AI=0
            INSTALL_MOBILE=0
          # ── Layer caching (GHA cache backend) ─────────────
          cache-from: type=gha,scope=core
          cache-to:   type=gha,mode=max,scope=core
          # ── Build provenance attestation ──────────────────
          provenance: true
          sbom: true

  # ── Job 2: Build & push AI variant ───────────────────────────
  build-ai:
    name: Build AI variant image
    runs-on: ubuntu-latest
    # Only build AI image on version tags, main branch push,
    # or when manually triggered with build_ai=true
    if: |
      github.event_name == 'push' && (
        startsWith(github.ref, 'refs/tags/v') ||
        github.ref == 'refs/heads/main'
      ) || (
        github.event_name == 'workflow_dispatch' &&
        github.event.inputs.build_ai == 'true'
      )
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (AI variant)
        id: meta-ai
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},suffix=-ai
            type=raw,value=latest-ai,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short,suffix=-ai

      - name: Build and push AI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          # ARM64 skipped for AI variant (heavy ML deps compile slowly)
          push: true
          tags: ${{ steps.meta-ai.outputs.tags }}
          labels: ${{ steps.meta-ai.outputs.labels }}
          build-args: |
            INSTALL_AI=1
            INSTALL_MOBILE=0
          cache-from: type=gha,scope=ai
          cache-to:   type=gha,mode=max,scope=ai

  # ── Job 3: Smoke test ─────────────────────────────────────────
  smoke-test:
    name: Smoke test image
    runs-on: ubuntu-latest
    needs: build-core
    # Only test on push events (not PRs, where image isn't pushed)
    if: github.event_name != 'pull_request'

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull latest image
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Smoke test — help output
        run: |
          docker run --rm \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            --help

      - name: Smoke test — toolcheck
        run: |
          docker run --rm \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            toolcheck

      - name: Smoke test — scan command (dry run)
        run: |
          docker run --rm \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            scan example.com
        # Don't fail the workflow if the scan itself produces warnings
        continue-on-error: true
